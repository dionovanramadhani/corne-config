# Custom OLED Status Screen for Left (Central) Half
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Enable WPM & Luna the Dog
CONFIG_ZMK_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
# Hemat daya: perlambat pergantian frame animasi agar I2C dan CPU lebih efisien
CONFIG_NICE_OLED_WIDGET_WPM_LUNA_ANIMATION_MS=380

# Clean UI: disable extra widgets so Luna and WPM take focus
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_LAYER=n
